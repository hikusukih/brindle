name: Boundary (real llama.cpp)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Latest llama.cpp release and its Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo ggml-org/llama.cpp --json tagName,assets --jq '.tagName, (.assets[].name | select(test("ubuntu")))'
      - name: Candidate tiny models
        run: |
          for repo in bartowski/SmolLM2-135M-Instruct-GGUF HuggingFaceTB/SmolLM2-135M-Instruct-GGUF Qwen/Qwen2.5-0.5B-Instruct-GGUF; do
            echo "== $repo"
            curl -sS "https://huggingface.co/api/models/$repo" | jq -r '.sha, (.siblings[].rfilename | select(test("(?i)q8_0|q4_k_m")))' || true
          done
