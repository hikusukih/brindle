name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not just the tip: a secret removed in a later commit is still published.
          fetch-depth: 0
      # The release binary rather than gitleaks-action, which needs a paid license on organization-owned repos.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      # Only the history behind this ref: by default gitleaks walks every fetched branch, so one bad branch would fail every PR. Each branch is still scanned by its own PR run.
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --verbose --log-opts="HEAD" .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t brindle .
      # Run it the way the README quickstart does, then check that the server answers through the published port.
      - name: Run the image and request the app
        run: |
          docker run -d --name brindle -p 127.0.0.1:8787:8787 -v brindle-data:/data brindle
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS http://127.0.0.1:8787/ | grep -qi '<html'
      - name: Container logs
        if: failure()
        run: docker logs brindle
